name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # --omit=dev: a shipped-dependency vuln would gate CI; a lint-tool-only
      # transitive advisory with no fix available (e.g. GHSA-vfj7-8cjw-p6xm in
      # braces, pulled in only by eslint-config-next's internal glob matching,
      # never bundled or run against untrusted input) should not block every
      # PR indefinitely.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build
        env:
          # build-time placeholder; real keys live only in Vercel env vars
          NVIDIA_API_KEY: ci-placeholder
